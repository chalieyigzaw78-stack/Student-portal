<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Student Portal</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing:border-box; margin:0; padding:0; }
    body {
      font-family:'Inter',sans-serif;
      background: linear-gradient(135deg, #1a237e 0%, #283593 50%, #1565c0 100%);
      min-height:100vh; display:flex; align-items:center; justify-content:center;
      padding:20px;
    }
    .login-box {
      background:white; border-radius:16px; padding:40px 36px;
      width:100%; max-width:400px;
      box-shadow:0 20px 60px rgba(0,0,0,0.3);
    }
    .logo { text-align:center; margin-bottom:28px; }
    .logo .icon { font-size:2.8rem; }
    .logo h1 { font-size:1.3rem; font-weight:800; color:#1a237e; margin-top:8px; }
    .logo p  { font-size:0.82rem; color:#757575; margin-top:4px; }
    .form-group { margin-bottom:16px; }
    .form-group label {
      display:block; font-size:0.75rem; font-weight:700;
      color:#616161; text-transform:uppercase; letter-spacing:0.05em; margin-bottom:6px;
    }
    .form-group input {
      width:100%; padding:11px 14px;
      border:1.5px solid #e0e0e0; border-radius:9px;
      font-size:0.95rem; font-family:inherit; color:#212121;
      transition:border-color 0.15s;
    }
    .form-group input:focus {
      outline:none; border-color:#3949ab;
      box-shadow:0 0 0 3px rgba(57,73,171,0.12);
    }
    .btn-login {
      width:100%; padding:12px;
      background:#1a237e; color:white; border:none;
      border-radius:9px; font-size:0.95rem; font-weight:700;
      cursor:pointer; transition:background 0.15s; margin-top:8px;
    }
    .btn-login:hover { background:#283593; }
    .flash-error {
      background:#ffebee; color:#c62828; border:1px solid #ef9a9a;
      padding:10px 14px; border-radius:8px; font-size:0.85rem;
      font-weight:600; margin-bottom:16px; text-align:center;
    }
    .divider {
      border:none; border-top:1px solid #eeeeee;
      margin:24px 0;
    }
    .roles {
      display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px;
      text-align:center;
    }
    .role-item {
      padding:10px 8px; background:#f5f5f5; border-radius:8px;
      font-size:0.75rem; color:#616161;
    }
    .role-item .role-icon { font-size:1.2rem; display:block; margin-bottom:4px; }
    .role-item strong { display:block; font-size:0.7rem; color:#1a237e; font-weight:700; }
  </style>
</head>
<body>

<div class="login-box">
  <div class="logo">
    <div class="icon">🎓</div>
    <h1>Student Portal</h1>
    <p>Academic Result Management System</p>
  </div>

  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, message in messages %}
      <div class="flash-{{ category }}">{{ message }}</div>
    {% endfor %}
  {% endwith %}

  <form method="POST" action="/login">
    <div class="form-group">
      <label>ID Number / Staff ID</label>
      <input type="text" name="user_id" placeholder="Enter your ID" required autofocus>
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" name="password" placeholder="Enter your password" required>
    </div>
    <button type="submit" class="btn-login">Sign In →</button>
  </form>

  <hr class="divider">

  <div class="roles">
    <div class="role-item">
      <span class="role-icon">👨‍🎓</span>
      <strong>STUDENT</strong>
      View results
    </div>
    <div class="role-item">
      <span class="role-icon">👨‍🏫</span>
      <strong>STAFF</strong>
      Enter results
    </div>
    <div class="role-item">
      <span class="role-icon">⚙️</span>
      <strong>ADMIN</strong>
      Full control
    </div>
  </div>
</div>

</body>
</html>
